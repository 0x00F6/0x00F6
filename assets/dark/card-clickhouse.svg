<title id="title">ClickHouse × MaxMindDB — PR #126009</title>
<desc id="desc">A clickhouse-client session: enable allow_experimental_maxminddb_table_engine, create table geoip with ENGINE = MaxMindDB(&#x27;GeoLite2-City.mmdb&#x27;) and refresh_interval 5m, then select country.iso_code where ip = toIPv4(&#x27;8.8.8.8&#x27;), which returns US.</desc>
