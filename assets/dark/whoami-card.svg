<title id="title">0x00F6 — finger card</title>
<desc id="desc">ID card styled as `finger 0x00f6` output next to a glitching ö glyph (U+00F6). Login 0x00f6, location Paris, FR. Plan: hook the kernel, decrypt my own traffic, geolocate everything. Projects: ebpf-network-nexus, clickhouse/maxminddb, libmaxminddb-rs. Clearance: ring 3 to ring 0 via eBPF, read-only.</desc>
