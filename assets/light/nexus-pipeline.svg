<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace">
<title id="title">eBPF Network Nexus — architecture</title>
<desc id="desc">Architecture of eBPF Network Nexus. In the kernel, eBPF programs capture TLS records and QUIC datagrams and send events to userspace. The Rust agent scans the target process memory for key candidates, verifies them by trial-decrypting captured records, decrypts, decompresses and parses HTTP/1.1, HTTP/2 and HTTP/3, then streams cleartext flows to the web Packet Inspector on port 8080.</desc>
