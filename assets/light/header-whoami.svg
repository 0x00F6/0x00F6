<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 196" width="1200" height="196" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace">
<title id="title">WHOAMI — 0x00F6</title>
<desc id="desc">Page header: the command finger 0x00f6 is typed, then a glitching WHOAMI title appears.</desc>
<style>
