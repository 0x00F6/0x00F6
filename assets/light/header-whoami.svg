<g style="animation:show .01s linear 1.96s both"><rect class="fg" x="1030.0" y="147" width="114.0" height="28" rx="3"/><text x="1042" y="166" class="ink" font-size="15" font-weight="700" textLength="90.0">U+00F6 = ö</text></g>
