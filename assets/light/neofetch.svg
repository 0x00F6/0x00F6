<title id="title">0x00F6 — neofetch</title>
<desc id="desc">neofetch-style summary next to a pixel-art crab. OS: Linux with eBPF. Langs: Rust, C++, C, Kotlin, SQL. Kernel: eBPF, Aya, XDP. Net: TLS 1.3, QUIC, HTTP/3, HTTP/2. Data: ClickHouse, MaxMind DB. Edge: HAProxy SPOA, FireHOL. Build: cargo, CMake. Motto: didn&#x27;t need to be this fast.</desc>
